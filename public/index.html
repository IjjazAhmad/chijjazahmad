    <style>
      .loader-container {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #222;
      }
      .loader {
        background: #00b4d8;
        width: 48px;
        height: 48px;
        position: relative;
        animation: 3s rotate linear infinite;
      }
      .loader:before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background: #ffff;
        animation: 1.5s rotate reverse linear infinite;
      }
      @keyframes rotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
